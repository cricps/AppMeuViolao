<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Treino de Violão</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --highlight: #03dac6;
            --text: #e0e0e0;
            --section-title: #ff5252; /* Cor vermelha para as seções */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px 15px 100px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; }
        
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .panel {
            background: #282828;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .ritmo-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .seta {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #383838;
            color: #777;
        }

        .seta.ativa {
            background: var(--highlight);
            color: #000;
            transform: scale(1.15);
            transition: transform 0.1s;
        }

        .controles-tom {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            background: var(--highlight);
            color: #000;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        button:active { opacity: 0.8; }

        .btn-imprimir {
            background: #bb86fc;
            color: #000;
            margin-left: auto;
        }

        .cifra-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.15rem;
            line-height: 1.8;
            white-space: pre-wrap;
            background: #181818;
            padding: 18px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .acorde {
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ESTILO PARA AS MARCAÇÕES DE ESTRUTURA (VERMELHO) */
        .secao-titulo {
            color: var(--section-title);
            font-weight: bold;
        }

        /* PAINEL DO DESENHO DO ACORDE (BRAÇO DO VIOLÃO) */
        .acorde-info-container {
            margin-top: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .acorde-titulo {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--highlight);
        }

        canvas#chordCanvas {
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .fixed-player-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 10px 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.7);
            z-index: 9999;
            display: flex;
            justify-content: center;
        }

        .dock-content {
            width: 100%;
            max-width: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        audio {
            width: 100%;
            height: 38px;
            border-radius: 20px;
            outline: none;
        }

        @media print {
            body { background: #ffffff !important; color: #000000 !important; padding: 0 !important; }
            .container { box-shadow: none !important; background: #ffffff !important; padding: 0 !important; max-width: 100% !important; }
            select, .controles-tom button, .fixed-player-dock, .acorde-info-container, .no-print { display: none !important; }
            h2 { color: #000000 !important; font-size: 18pt !important; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px !important; }
            .panel { background: #f0f0f0 !important; color: #000000 !important; border: 1px solid #ccc !important; margin-bottom: 15px !important; }
            .seta { background: #e0e0e0 !important; color: #000000 !important; }
            .cifra-box { background: #ffffff !important; color: #000000 !important; border: none !important; font-size: 11pt !important; line-height: 1.6 !important; padding: 0 !important; }
            .acorde { color: #d32f2f !important; font-weight: bold !important; text-decoration: none !important; }
            .secao-titulo { color: #b71c1c !important; font-weight: bold !important; }
        }
    </style>
</head>

    function desenharBraoViolao(nomeAcorde, dadosAcorde) {
        const canvas = document.getElementById('chordCanvas');
        const ctx = canvas.getContext('2d');
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        document.getElementById('nomeAcordeExibido').innerText = `Acorde: ${nomeAcorde}`;

        if (!dadosAcorde) return;

        const frets = dadosAcorde.frets;
        const barreFret = dadosAcorde.barre;
        const barreStart = dadosAcorde.barreStart !== undefined ? dadosAcorde.barreStart : 0;
        
        const numFrets = frets.filter(f => typeof f === 'number' && f > 0);
        const minFret = numFrets.length > 0 ? Math.min(...numFrets) : 1;
        const startFret = minFret > 3 ? minFret : 1;

        const startX = 35;
        const startY = 40;
        const stringGap = 28;
        const fretGap = 38;

        ctx.fillStyle = '#888';
        ctx.font = 'bold 12px sans-serif';
        
        if (startFret > 1) {
            ctx.fillText(`${startFret}ª casa`, 5, startY + 25);
        } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(startX - 2, startY - 6, 5 * stringGap + 4, 6);
        }

        ctx.strokeStyle = '#666';
        ctx.lineWidth = 2;
        for (let i = 0; i <= 4; i++) {
            ctx.beginPath();
            ctx.moveTo(startX, startY + (i * fretGap));
            ctx.lineTo(startX + (5 * stringGap), startY + (i * fretGap));
            ctx.stroke();
        }

        for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.lineWidth = 1 + (0.4 * (5 - i));
            ctx.moveTo(startX + (i * stringGap), startY);
            ctx.lineTo(startX + (i * stringGap), startY + (4 * fretGap));
            ctx.stroke();
        }

        const nomesCordas = ['E', 'A', 'D', 'G', 'B', 'e'];
        ctx.fillStyle = '#888';
        ctx.font = '11px sans-serif';
        for (let i = 0; i < 6; i++) {
            ctx.fillText(nomesCordas[i], startX + (i * stringGap) - 4, startY + (4 * fretGap) + 18);
        }

        if (barreFret) {
            const relBarreFret = barreFret - startFret + 1;
            if (relBarreFret >= 1 && relBarreFret <= 4) {
                const y = startY + (relBarreFret * fretGap) - (fretGap / 2);
                const xStart = startX + (barreStart * stringGap);
                const xEnd = startX + (5 * stringGap);

                ctx.fillStyle = '#bb86fc';
                ctx.beginPath();
                ctx.roundRect(xStart - 10, y - 8, (xEnd - xStart) + 20, 16, 8);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('1', xStart - 3, y + 3);
            }
        }

        frets.forEach((fret, cordaIdx) => {
            const x = startX + (cordaIdx * stringGap);

            if (fret === 'x' || fret === 'X') {
                ctx.fillStyle = '#ff5252';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('✕', x - 6, startY - 12);
            } else if (fret === 0) {
                ctx.strokeStyle = '#03dac6';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, startY - 16, 5, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                const relFret = fret - startFret + 1;
                if (relFret >= 1 && relFret <= 4 && (fret !== barreFret || cordaIdx < barreStart)) {
                    const y = startY + (relFret * fretGap) - (fretGap / 2);
                    
                    ctx.fillStyle = '#bb86fc';
                    ctx.beginPath();
                    ctx.arc(x, y, 9, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText(fret, x - 3, y + 3);
                }
            }
        });
    }

    function verAcorde(acorde) {
        const dados = dicionarioAcordes[acorde];
        desenharBraoViolao(acorde, dados);
    }

    audioPlayer.onplay = function() {
        pararTreino();
        const ms = (60 / musicaAtual.bpm) * 1000 / 2;
        intervalId = setInterval(atualizarRitmo, ms);
        const tempoScroll = musicaAtual.scrollSpeed || 60;
        scrollInterval = setInterval(() => window.scrollBy(0, 1), tempoScroll);
    };

    audioPlayer.onpause = function() { pararTreino(); };
    audioPlayer.onended = function() { pararTreino(); };

    function pararTreino() {
        if (intervalId) clearInterval(intervalId);
        if (scrollInterval) clearInterval(scrollInterval);
        intervalId = null;
        scrollInterval = null;
        passoAtual = 0;
        document.querySelectorAll('.seta').forEach(el => el.classList.remove('ativa'));
    }

    function atualizarRitmo() {
        document.querySelectorAll('.seta').forEach(el => el.classList.remove('ativa'));
        const elSeta = document.getElementById(`seta-${passoAtual}`);
        if (elSeta) elSeta.classList.add('ativa');
        passoAtual = (passoAtual + 1) % musicaAtual.setas.length;
    }

    function mudarTom(semitons) {
        tomDeslocamento += semitons;
        document.getElementById('transposicaoVal').innerText = `${tomDeslocamento > 0 ? '+' : ''}${tomDeslocamento} semiton(s)`;
        
        const elementos = document.querySelectorAll('.acorde');
        elementos.forEach(el => {
            const acordeOriginal = el.getAttribute('onclick').match(/'([^']+)'/)[1];
            const novoAcorde = transpositor(acordeOriginal, semitons);
            el.innerText = novoAcorde;
            el.setAttribute('onclick', `verAcorde('${novoAcorde}')`);
        });
    }

    function transpositor(acorde, quantidade) {
        const ehMenor = acorde.endsWith('m');
        const notaBase = ehMenor ? acorde.slice(0, -1) : acorde;
        let idx = escalaAcordes.indexOf(notaBase);
        
        if (idx === -1) return acorde;
        
        let novoIdx = (idx + quantidade) % 12;
        if (novoIdx < 0) novoIdx += 12;
        
        return escalaAcordes[novoIdx] + (ehMenor ? 'm' : '');
    }

    carregarMusica('euAmeiTeVer');
</script>
